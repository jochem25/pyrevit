<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Achtergrond -->
  <rect x="1" y="1" width="30" height="30" rx="3" fill="#350E35"/>

  <!-- Hangslot = de constraint -->
