        stroke="#350E35" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="4.5" y1="27.5" x2="27.5" y2="4.5"
        stroke="#DB4C40" stroke-width="2.6" stroke-linecap="round"/>
